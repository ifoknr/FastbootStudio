name: screenshots

# Runs the real app on Windows with a generated sample OTA and captures every tab.
# Doubles as a smoke test: the job fails if the app does not start or crashes.
on:
  workflow_dispatch:
  push:
    paths:
      - '*.xaml'
      - '*.cs'
      - 'src/**'
      - 'tools/FastbootEnhance.SampleGen/**'
      - 'tools/FastbootEnhance.FakeFastboot/**'
      - 'tools/FastbootEnhance.FakeAdb/**'
      - 'Themes/**'
      - 'Properties/**'
      - '.github/scripts/screenshots.ps1'
      - '.github/workflows/screenshots.yml'

permissions:
  contents: write

# One run at a time per branch: a second push waits for the first run's screenshots instead of
# racing it to the branch.
concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  capture:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # full history so the commit step can rebase

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x

      - name: Publish app
        run: >
          dotnet publish FastbootEnhance.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true -o publish

      - name: Generate sample OTA
        run: dotnet run --project tools/FastbootEnhance.SampleGen -c Release -- sample

      # The runner has no phone, so the real fastboot.exe and adb.exe are swapped for
      # stand-ins: one device in fastbootd, and one in a custom recovery over adb.
      # Only this test copy is touched.
      - name: Swap in the stand-in fastboot and adb
        shell: pwsh
        run: |
          dotnet publish tools/FastbootEnhance.FakeFastboot -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o fakefb
          Copy-Item fakefb/fastboot.exe publish/fastboot.exe -Force
          dotnet publish tools/FastbootEnhance.FakeAdb -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o fakeadb
          Copy-Item fakeadb/adb.exe publish/adb.exe -Force

      # The sample OTA has 12 partitions; every one of them must reach "fastboot flash".
      # The stand-in phone has 20 critical partitions; each must be backed up intact.
      - name: Capture
        shell: pwsh
        run: ./.github/scripts/screenshots.ps1 -App publish/FastbootStudio.exe -Payload sample/sample-ota.zip -Out docs/screenshots -ExpectedFlashes 12 -ExpectedBackups 20 -Arabic

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: screenshots
          path: docs/screenshots/
          if-no-files-found: warn

      # Committed back so the images can be viewed straight from the branch.
      - name: Commit screenshots
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "IFOKNR"
          git config user.email "253658289+ifoknr@users.noreply.github.com"
          git add docs/screenshots
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host "The screenshots did not change."; exit 0 }
          git commit -m "Update app screenshots [skip ci]"
          if ($LASTEXITCODE -ne 0) { throw "The screenshots could not be committed." }

          # The branch may have moved while the app was being captured. A rebase used to be tried
          # here; two runs' PNGs conflict in it, and the step then ended without pushing.
          git fetch origin $env:BRANCH
          if ($LASTEXITCODE -ne 0) { throw "The branch could not be fetched." }
          $tip = git rev-parse FETCH_HEAD
          if ($tip -ne $env:GITHUB_SHA) {
            # Anything but screenshots added since this run's commit means a newer run will
            # capture newer code: its pictures are the ones to keep, so this run adds none.
            $newer = git log --format=%H "$env:GITHUB_SHA..FETCH_HEAD" -- . ":(exclude)docs/screenshots"
            if ($newer) {
              Write-Host "::notice::The branch has newer source commits; their own run captures them. Nothing pushed."
              exit 0
            }
            # Only screenshot commits were added: this run's captures go on top of the tip.
            $mine = git rev-parse HEAD
            git reset --hard FETCH_HEAD
            git checkout $mine -- docs/screenshots
            git add docs/screenshots
            git diff --cached --quiet
            if ($LASTEXITCODE -eq 0) { Write-Host "The branch already has these screenshots."; exit 0 }
            git commit -m "Update app screenshots [skip ci]"
            if ($LASTEXITCODE -ne 0) { throw "The screenshots could not be committed on the new tip." }
          }
          git push origin HEAD:$env:BRANCH
          if ($LASTEXITCODE -ne 0) { throw "The screenshots could not be pushed." }
