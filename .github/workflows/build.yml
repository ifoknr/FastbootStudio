name: build

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  core:
    name: core library and tests (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: |
          dotnet restore src/FastbootEnhance.Core/FastbootEnhance.Core.csproj
          dotnet restore tests/FastbootEnhance.Core.Tests/FastbootEnhance.Core.Tests.csproj
          dotnet restore tools/FastbootEnhance.PayloadTool/FastbootEnhance.PayloadTool.csproj

      - name: Build core
        run: dotnet build src/FastbootEnhance.Core/FastbootEnhance.Core.csproj -c Release --no-restore

      - name: Test
        run: >
          dotnet test tests/FastbootEnhance.Core.Tests/FastbootEnhance.Core.Tests.csproj
          -c Release --no-restore --logger "console;verbosity=normal"

      - name: Build payload tool
        run: dotnet build tools/FastbootEnhance.PayloadTool/FastbootEnhance.PayloadTool.csproj -c Release --no-restore

  app:
    name: wpf app (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # WPF cannot be compiled on Linux, so this job is what proves the app itself builds.
      - name: Restore
        run: dotnet restore FastbootEnhance.csproj

      - name: Build
        run: dotnet build FastbootEnhance.csproj -c Release --no-restore

      - name: Publish single file
        run: >
          dotnet publish FastbootEnhance.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true -o publish

      - name: Check published output
        shell: pwsh
        run: |
          Get-ChildItem publish | Select-Object Name, Length
          # fastboot.exe runs as its own process, so it must sit beside the exe, not inside it.
          foreach ($f in 'FastbootStudio.exe', 'fastboot.exe', 'adb.exe', 'AdbWinApi.dll', 'AdbWinUsbApi.dll', 'platform-tools-NOTICE.txt') {
            if (-not (Test-Path (Join-Path publish $f))) { throw "$f missing from publish output" }
          }

      # The Samsung driver button keeps an installer only when Windows verifies Samsung's
      # signature on it. Checked here with Samsung's real file; if Samsung cannot be reached,
      # this only warns, since the check is about the app, not Samsung's servers.
      - name: Samsung driver link and signature
        shell: pwsh
        run: |
          $gen = 'tools/FastbootEnhance.SampleGen'
          $neg = dotnet run --project $gen -c Release -- signer publish/adb.exe
          Write-Host "adb.exe: $neg"
          if (-not ($neg -match 'samsung=False')) { throw "adb.exe was taken for Samsung's driver" }
          # A working check names Google on adb.exe; a broken one would name nobody.
          if (-not ($neg -match 'O=Google LLC')) { throw "adb.exe's Google signature was not verified" }
          $copy = Join-Path $env:RUNNER_TEMP 'locked-adb.exe'
          Copy-Item publish/adb.exe $copy
          Copy-Item publish/AdbWinApi.dll, publish/AdbWinUsbApi.dll $env:RUNNER_TEMP
          $run = dotnet run --project $gen -c Release -- run-locked $copy version
          Write-Host "run while held open: $run"
          if (-not ($run -match 'exit=0')) { throw "a program held open for its check could not be started" }
          $bad = Join-Path $env:RUNNER_TEMP 'unsigned.exe'
          Copy-Item publish/adb.exe $bad
          $bytes = [IO.File]::ReadAllBytes($bad); $bytes[1024] = $bytes[1024] -bxor 0xFF; [IO.File]::WriteAllBytes($bad, $bytes)
          $tampered = dotnet run --project $gen -c Release -- signer $bad
          Write-Host "tampered adb.exe: $tampered"
          if (-not ($tampered -match 'no trusted signature')) { throw "a tampered file passed the signature check" }
          try {
            $page = Join-Path $env:RUNNER_TEMP 'samsung.html'
            Invoke-WebRequest 'https://developer.samsung.com/android-usb-driver' -UseBasicParsing -TimeoutSec 60 -OutFile $page
            $link = dotnet run --project $gen -c Release -- samsung-link $page
            if ($LASTEXITCODE -ne 0) { Write-Warning "no download link found on Samsung's page"; $link = 'https://developer.samsung.com/SDP/file/a2fcaf64-7aa3-49f7-b06f-9e646590d528' }
            Write-Host "link: $link"
            $drv = Join-Path $env:RUNNER_TEMP 'samsung-driver.exe'
            Invoke-WebRequest $link -UseBasicParsing -TimeoutSec 300 -OutFile $drv
          } catch {
            Write-Warning "Samsung could not be reached: $_"
            exit 0
          }
          $head = [IO.File]::ReadAllBytes($drv)
          if ($head.Length -lt 5MB -or $head[0] -ne 0x4D -or $head[1] -ne 0x5A) {
            Write-Warning "Samsung did not send the installer (got $($head.Length) bytes)"
            exit 0
          }
          $pos = dotnet run --project $gen -c Release -- signer $drv
          Write-Host "Samsung's installer: $pos"
          if (-not ($pos -match 'samsung=True')) { throw "Samsung's own installer did not pass the signature check" }

      - uses: actions/upload-artifact@v4
        with:
          name: FastbootStudio-win-x64
          path: publish/
          if-no-files-found: error
